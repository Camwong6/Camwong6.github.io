<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027"/>
      <stop offset="50%" style="stop-color:#1a3a4a"/>
      <stop offset="100%" style="stop-color:#0d3347"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0e7490;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4bf"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e4a5c" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="534" y1="0" x2="534" y2="450"/>
    <line x1="667" y1="0" x2="667" y2="450"/>
  </g>

  <!-- Shield shape (background fill) -->
  <path d="M400,80 L530,130 L530,240 Q530,330 400,385 Q270,330 270,240 L270,130 Z"
        fill="url(#shieldGrad)" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Outer scan ring -->
  <circle cx="400" cy="232" r="95" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Middle ring -->
  <circle cx="400" cy="232" r="72" fill="none" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Inner scan circle -->
  <circle cx="400" cy="232" r="52" fill="none" stroke="#2dd4bf" stroke-width="2" opacity="0.8" filter="url(#glow)"/>

  <!-- Center circle fill -->
  <circle cx="400" cy="232" r="38" fill="#0f2d3d" stroke="#2dd4bf" stroke-width="1" opacity="0.9"/>

  <!-- Crosshair lines inside center -->
  <line x1="400" y1="204" x2="400" y2="218" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>
  <line x1="400" y1="246" x2="400" y2="260" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>
  <line x1="372" y1="232" x2="386" y2="232" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>
  <line x1="414" y1="232" x2="428" y2="232" stroke="#2dd4bf" stroke-width="1.5" opacity="0.9"/>

  <!-- Center dot -->
  <circle cx="400" cy="232" r="5" fill="#2dd4bf" opacity="0.95" filter="url(#glow)"/>

  <!-- Scan sweep arc (animated feel via partial arc) -->
  <path d="M400,180 A52,52 0 0,1 449,214" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>

  <!-- Corner brackets — top left -->
  <path d="M298,155 L298,140 L313,140" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- top right -->
  <path d="M487,140 L502,140 L502,155" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- bottom left -->
  <path d="M298,308 L298,323 L313,323" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- bottom right -->
  <path d="M487,323 L502,323 L502,308" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Data readout bars (left side) -->
  <g opacity="0.55">
    <rect x="168" y="185" width="60" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="168" y="197" width="42" height="4" rx="2" fill="#0ea5e9"/>
    <rect x="168" y="209" width="52" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="168" y="221" width="35" height="4" rx="2" fill="#0ea5e9"/>
    <rect x="168" y="233" width="55" height="4" rx="2" fill="#2dd4bf"/>
    <text x="168" y="178" font-family="monospace" font-size="9" fill="#2dd4bf" opacity="0.8">ANALYSIS</text>
  </g>

  <!-- Data readout bars (right side) -->
  <g opacity="0.55">
    <text x="574" y="178" font-family="monospace" font-size="9" fill="#2dd4bf" opacity="0.8" text-anchor="end">RISK SCORE</text>
    <rect x="574" y="185" width="-55" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="574" y="197" width="-30" height="4" rx="2" fill="#0ea5e9"/>
    <rect x="574" y="209" width="-48" height="4" rx="2" fill="#2dd4bf"/>
    <rect x="574" y="221" width="-25" height="4" rx="2" fill="#0ea5e9"/>
    <rect x="574" y="233" width="-40" height="4" rx="2" fill="#2dd4bf"/>
  </g>

  <!-- Title -->
  <text x="400" y="360" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="700"
        fill="white" text-anchor="middle" letter-spacing="2">SkinGuard</text>

  <!-- Subtitle -->
  <text x="400" y="388" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400"
        fill="#94a3b8" text-anchor="middle" letter-spacing="1">AI-Powered Skin Cancer Screening</text>

  <!-- Top label -->
  <text x="400" y="55" font-family="monospace" font-size="10" fill="#2dd4bf" text-anchor="middle" opacity="0.7" letter-spacing="3">GEMINI VISION · PYTHON · ML</text>

  <!-- Decorative teal accent line under title -->
  <line x1="340" y1="396" x2="460" y2="396" stroke="#2dd4bf" stroke-width="1.5" opacity="0.5"/>
</svg>
